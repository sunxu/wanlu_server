server {
    listen 443 ssl;
    server_name appadmin.wthigh.com;
    root /opt/jingling/admin_vue/dist/;

    ssl_certificate /opt/jingling/etc/nginx/appadmin.wthigh.com.pem;
    ssl_certificate_key /opt/jingling/etc/nginx/appadmin.wthigh.com.key;
    ssl_session_timeout 5m;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    location /uc/ {
        proxy_pass http://127.0.0.1:9521;

        proxy_http_version                 1.1;
        proxy_cache_bypass                 $http_upgrade;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout              60s;
        proxy_send_timeout                 60s;
        proxy_read_timeout                 60s;
   }

    location ~ \.php$ {
    	root /opt/jingling/adminer/;
        fastcgi_pass 127.0.0.1:9000;
		try_files                     $fastcgi_script_name =404;
		include                       fastcgi_params;
		fastcgi_index                 index.php;
		fastcgi_buffers               8 16k;
		fastcgi_buffer_size           32k;
		fastcgi_param DOCUMENT_ROOT   $realpath_root;
		fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }
}
