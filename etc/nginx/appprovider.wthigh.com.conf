server {
    listen 443 ssl;
    server_name appprovider.wthigh.com;

    ssl_certificate /opt/jingling/etc/nginx/appprovider.wthigh.com.pem;
    ssl_certificate_key /opt/jingling/etc/nginx/appprovider.wthigh.com.key;
    ssl_session_timeout 5m;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
    	root /opt/jingling/www/appprovider.wthigh.com/;
    }
}
