[program:artisan_queue_crontab_4]
command=php /opt/jingling/api_server/artisan queue:work --delay=3 --sleep=1 --tries=3 --queue={crontab}
process_name=%(program_name)s
numprocs=1
directory=/opt/jingling/api_server
autostart=true
autorestart=true
startsecs=10
startretries=3
exitcodes=0,2
stopsignal=QUIT
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/opt/jingling/logs/artisan_queue_crontab_4.stdout.log
stdout_logfile_maxbytes=500MB
stdout_logfile_backups=3
stdout_capture_maxbytes=1MB
stdout_events_enabled=false
