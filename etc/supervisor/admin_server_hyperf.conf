[program:hyperf.php]
command=php bin/hyperf.php start
process_name=%(program_name)s
numprocs=1
directory=/opt/jingling/admin_server
autostart=true
autorestart=true
startsecs=10
startretries=3
exitcodes=0,2
stopsignal=QUIT
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/opt/jingling/logs/hyperf.php.stdout.log
stdout_logfile_maxbytes=500MB
stdout_logfile_backups=3
stdout_capture_maxbytes=1MB
stdout_events_enabled=false
